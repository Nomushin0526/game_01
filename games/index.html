<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ゲームコレクション</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/ui.css" />
    <style>
      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 10%, #ffe3a8 0, transparent 40%),
          radial-gradient(circle at 90% 80%, #c9f1ec 0, transparent 45%),
          var(--paper);
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 16px 64px;
      }
      h1 {
        font-size: clamp(30px, 6vw, 46px);
        font-weight: 900;
        margin: 0 0 6px;
        letter-spacing: 0.02em;
      }
      .lead {
        margin: 0 0 32px;
        color: var(--ink-soft);
        font-weight: 500;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 22px;
      }
      .card {
        display: flex;
        flex-direction: column;
        border: 3px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        box-shadow: 0 6px 0 var(--line);
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        transition: transform 0.12s ease;
      }
      a.card:hover {
        transform: translateY(-3px) rotate(-0.4deg);
      }
      .thumb {
        position: relative;
        height: 150px;
        border-bottom: 3px solid var(--line);
        overflow: hidden;
      }
      .thumb-cart {
        background: linear-gradient(#fdf3df 0 55%, #e7dfcf 55%);
      }
      /* 店内の棚と通路をCSSで簡易表現 */
      .thumb-cart::before,
      .thumb-cart::after {
        content: '';
        position: absolute;
        top: 22%;
        bottom: 0;
        width: 34%;
        background: repeating-linear-gradient(
          #b8c0c7 0 6px,
          #6cc070 6px 20px,
          #b8c0c7 20px 26px,
          #ec6f6f 26px 40px,
          #b8c0c7 40px 46px,
          #f3b740 46px 60px
        );
      }
      .thumb-cart::before {
        left: 0;
        clip-path: polygon(0 0, 100% 45%, 100% 100%, 0 100%);
      }
      .thumb-cart::after {
        right: 0;
        clip-path: polygon(0 45%, 100% 0, 100% 100%, 0 100%);
      }
      .thumb-cart span {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        font-size: 56px;
        z-index: 1;
      }
      .thumb-soon {
        background: repeating-linear-gradient(45deg, #f3eee2 0 14px, #ebe4d4 14px 28px);
        display: grid;
        place-items: center;
        font-size: 44px;
        font-weight: 900;
        color: #c7bda8;
      }
      .body {
        padding: 16px 18px 18px;
      }
      .body h2 {
        margin: 8px 0 4px;
        font-size: 22px;
        font-weight: 900;
      }
      .body p {
        margin: 0;
        font-size: 14px;
        color: var(--ink-soft);
        line-height: 1.6;
      }
      .card.soon {
        box-shadow: none;
        border-style: dashed;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>ゲームコレクション</h1>
      <p class="lead">スマホのブラウザですぐ遊べるミニゲーム集（縦画面）</p>

      <div class="grid">
        <a class="card" href="cart-rush/index.html">
          <div class="thumb thumb-cart"><span aria-hidden="true">🛒</span></div>
          <div class="body">
            <span class="tag">3Dランゲーム</span>
            <h2>カートラッシュ！</h2>
            <p>ショッピングカートでスーパーから家まで大爆走。お客さんも車もかわしてゴールを目指せ！</p>
          </div>
        </a>

        <div class="card soon" aria-disabled="true">
          <div class="thumb thumb-soon">?</div>
          <div class="body">
            <span class="tag" style="background: #eee">準備中</span>
            <h2>次のゲーム</h2>
            <p>games/ フォルダに追加して、このページにカードを足すと並びます。</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
